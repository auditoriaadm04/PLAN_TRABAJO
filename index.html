<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Trabajo</title>
    <style>
        :root {
            --primary: #25D366;
            /* WhatsApp Green */
            --primary-dark: #128C7E;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #111b21;
            --text-muted: #667781;
            --border: #d1d7db;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--text-main);
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-2px);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--text-main);
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #f9f9fa;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.2);
            background-color: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .phone-input {
            display: flex;
            gap: 10px;
        }

        .phone-input .prefix {
            width: 80px;
        }

        .phone-input .number {
            flex-grow: 1;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        button:active {
            transform: scale(0.98);
        }

        button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Plan de Trabajo</h1>
        <p class="subtitle">Diligencia tus tareas y envíalas por WhatsApp</p>

        <div class="form-group">
            <label for="nombre">Tu Nombre</label>
            <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required>
        </div>

        <div class="form-group">
            <label for="fecha">Fecha del Plan</label>
            <input type="date" id="fecha" required>
        </div>

        <div class="form-group">
            <label for="tareas">Tareas / Actividades a realizar</label>
            <textarea id="tareas"
                placeholder="1. Revisar correos...&#10;2. Preparar informe...&#10;3. Reunión de equipo..."
                required></textarea>
        </div>

        <div class="form-group">
            <label>WhatsApp de tu Jefe</label>
            <div class="phone-input">
                <!-- Se asume código 57 de Colombia por defecto, el usuario puede cambiarlo -->
                <input type="text" id="codigo_pais" class="prefix" placeholder="+57" value="57">
                <input type="text" id="telefono_jefe" class="number" placeholder="3001234567" required>
            </div>
            <small style="color: var(--text-muted); font-size: 12px; margin-top: 4px; display: block;">Sin el símbolo +
                (Ej: 57 para Colombia, 52 para México, etc.)</small>
        </div>

        <button onclick="enviarWhatsApp()">
            <svg viewBox="0 0 24 24">
                <path
                    d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z" />
            </svg>
            Enviar por WhatsApp
        </button>
    </div>

    <script>
        // Establecer la fecha actual por defecto
        document.getElementById('fecha').valueAsDate = new Date();

        function enviarWhatsApp() {
            const nombre = document.getElementById('nombre').value.trim();
            const fecha = document.getElementById('fecha').value;
            const tareas = document.getElementById('tareas').value.trim();
            let codigo_pais = document.getElementById('codigo_pais').value.trim().replace('+', '');
            let telefono = document.getElementById('telefono_jefe').value.trim();

            if (!nombre || !fecha || !tareas || !telefono) {
                alert("Por favor, completa todos los campos antes de enviar.");
                return;
            }

            // Eliminar espacios o caracteres no numéricos del teléfono
            telefono = telefono.replace(/\D/g, '');
            codigo_pais = codigo_pais.replace(/\D/g, '');

            const numeroCompleto = codigo_pais + telefono;

            // Construir el mensaje con formato para WhatsApp (negrillas, listas, etc)
            const mensaje = `*PLAN DE TRABAJO* 📋\n\n*👨‍💻 Nombre:* ${nombre}\n*📅 Fecha:* ${fecha}\n\n*✅ Actividades a realizar:*\n${tareas}\n\n_Enviado desde mi portal web._`;

            // Codificar el texto para la URL
            const textoCodificado = encodeURIComponent(mensaje);

            // Crear la URL de WhatsApp (API oficial)
            const urlWhatsApp = `https://wa.me/${numeroCompleto}?text=${textoCodificado}`;

            // Abrir WhatsApp en una nueva pestaña (web o app si está instalada)
            window.open(urlWhatsApp, '_blank');
        }
    </script>
</body>

</html>
