<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Trabajo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            color: #1a202c;
            font-size: 24px;
        }

        .header p {
            margin: 5px 0 0;
            color: #718096;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 600;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 15px;
            color: #4a5568;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: #4299e1;
        }

        .time-group {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .time-group .time-input {
            flex: 1;
        }

        .hidden {
            display: none;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #218838;
        }

        .btn-submit:disabled {
            background-color: #94d3a2;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .alert.success {
            background-color: #d4edda;
            color: #155724;
            display: block;
        }

        .alert.error {
            background-color: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>Plan de Trabajo</h1>
            <p>Diligencia tus tareas y envíalas al registro</p>
        </div>

        <form id="workPlanForm">
            <div class="form-group">
                <label for="nombre">Tu Nombre</label>
                <input type="text" id="nombre" class="form-control" placeholder="Ej: Juan Pérez" required>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha del Plan</label>
                <input type="date" id="fecha" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="actividad">Tareas / Actividades a realizar</label>
                <select id="actividad" class="form-control" required>
                    <option value="">Selecciona una actividad...</option>
                    <option value="FINALIZACIÓN Y ENSAYO DE INFORME DE RESULTADO">Finalización y ensayo de informe de
                        resultado</option>
                    <option value="PRESENTACIÓN INFORME DE RESULTADO">Presentación informe de resultado</option>
                    <option value="TABLERO DE PROPORCIÓN DE SALAS">Tablero de proporción de salas</option>
                    <option value="ACTUALIZACIÓN DE BASES">Actualización de bases</option>
                    <option value="otra">Otra</option>
                </select>

                <div id="otraActividadContainer" class="hidden" style="margin-top: 15px;">
                    <label for="otraActividad">Escribe la actividad</label>
                    <input type="text" id="otraActividad" class="form-control" placeholder="Describe la actividad">
                </div>

                <div id="timeContainer" class="time-group hidden">
                    <div class="time-input">
                        <label for="horaInicio">Hora de inicio</label>
                        <input type="time" id="horaInicio" class="form-control">
                    </div>
                    <div class="time-input">
                        <label for="horaFin">Hora de fin</label>
                        <input type="time" id="horaFin" class="form-control">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Enviar a Google Drive</button>
            <div id="message" class="alert"></div>
        </form>
    </div>

    <script>
        const actividadSelect = document.getElementById('actividad');
        const otraActividadContainer = document.getElementById('otraActividadContainer');
        const otraActividadInput = document.getElementById('otraActividad');
        const timeContainer = document.getElementById('timeContainer');
        const horaInicioInput = document.getElementById('horaInicio');
        const horaFinInput = document.getElementById('horaFin');

        // Configurar la fecha actual por defecto
        document.getElementById('fecha').valueAsDate = new Date();

        actividadSelect.addEventListener('change', function () {
            if (this.value !== "") {
                timeContainer.classList.remove('hidden');
                horaInicioInput.required = true;
                horaFinInput.required = true;
            } else {
                timeContainer.classList.add('hidden');
                horaInicioInput.required = false;
                horaFinInput.required = false;
            }

            if (this.value === 'otra') {
                otraActividadContainer.classList.remove('hidden');
                otraActividadInput.required = true;
            } else {
                otraActividadContainer.classList.add('hidden');
                otraActividadInput.required = false;
            }
        });

        // Formatear hora (de 24h a 12h AM/PM) para que coincida con el formato del Drive
        function formatTime(timeStr) {
            const [hours, minutes] = timeStr.split(':');
            let h = parseInt(hours);
            const ampm = h >= 12 ? 'P.m' : 'a.m';
            h = h % 12;
            h = h ? h : 12;
            return `${h}:${minutes} ${ampm}`;
        }

        // Formatear fecha a DD-MM-YYYY
        function formatDate(dateStr) {
            const [year, month, day] = dateStr.split('-');
            return `${day}-${month}-${year}`;
        }

        document.getElementById('workPlanForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando...';
            messageDiv.className = 'alert';
            messageDiv.textContent = '';

            const nombre = document.getElementById('nombre').value;
            const fechaRaw = document.getElementById('fecha').value;
            const fecha = formatDate(fechaRaw);

            let actividad = actividadSelect.value;
            if (actividad === 'otra') {
                actividad = otraActividadInput.value.toUpperCase(); // En mayúscula como en la imagen
            }

            const horaInicio = document.getElementById('horaInicio').value;
            const horaFin = document.getElementById('horaFin').value;
            const horaFormateada = `${formatTime(horaInicio)} - ${formatTime(horaFin)}`;

            // Crear objeto de datos para enviar
            const data = {
                fecha: fecha,
                hora: horaFormateada,
                descripcion: actividad,
                responsable: nombre.toUpperCase(),
                cumplimiento: false, // Checkbox desmarcado por defecto
                obs: ""
            };

            // REEMPLAZAR ESTA URL CON LA URL DE TU WEB APP DE GOOGLE APPS SCRIPT
            const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyJSGLnMjwy4sP5aKf4pHhWmvm9zBoovz4B6EXYu8uV3zVJUQVOUSV-1Sxv7SpxJMCI/exec';

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Evita errores de CORS
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
                .then(() => {
                    messageDiv.textContent = '¡Actividad registrada exitosamente!';
                    messageDiv.className = 'alert success';
                    document.getElementById('workPlanForm').reset();
                    document.getElementById('fecha').valueAsDate = new Date();
                    timeContainer.classList.add('hidden');
                    otraActividadContainer.classList.add('hidden');
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    messageDiv.textContent = 'Hubo un error al enviar. Por favor intenta de nuevo.';
                    messageDiv.className = 'alert error';
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Enviar a Google Drive';
                });
        });
    </script>
</body>

</html>
